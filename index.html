<style>
/* ===== デザインシステム「浮世勤怠帖」のトークン ===== */
:root{
  --washi:#F2EAD8; --kinari:#FAF5EA; --suna:#D9CCB0; --usuzumi:#6B6155; --sumi:#2A2520;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--washi);color:var(--sumi);font-family:var(--gothic);font-feature-settings:"palt";-webkit-text-size-adjust:100%}

.screen{position:relative;padding:calc(28px + env(safe-area-inset-top)) var(--gutter) 24px;display:flex;flex-direction:column;gap:20px;min-height:calc(100dvh - var(--tabbar))}

.rakkan{position:absolute;right:16px;bottom:-22px;width:60px;height:60px;background:var(--shu);color:var(--kinari);border-radius:2px;outline:1.5px solid var(--kinari);outline-offset:-6px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--mincho);font-weight:800;font-size:19px;letter-spacing:.1em;transform:rotate(-4deg)}

dl{margin:0} dd{margin:0}

.tabbar a[aria-current="page"]{color:var(--shu);font-weight:700;border-top-color:var(--shu)}

.cal button,.cal span.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;background:transparent;border:1.5px solid transparent;border-bottom:1px solid var(--suna);cursor:pointer}

.cal .sat .d{color:var(--ai)} .cal .sun .d,.cal .hol .d{color:var(--usuzumi)}
.bars{height:150px;display:flex;align-items:flex-end;gap:3px;border-bottom:1.5px solid var(--sumi);overflow:hidden}
.bars .b{flex:1 1 0;min-width:0;max-width:28px;display:flex;flex-direction:column;align-items:center;gap:2px}
.bars .b span{font-family:var(--mincho);font-weight:700;font-size:10px}
.bars .b i{display:block;width:100%;background:var(--suna);border:1.5px solid var(--sumi);border-bottom:0;border-radius:2px 2px 0 0}
.bars .b.peak i{background:var(--shu)} .bars .b.peak span{color:var(--shu);font-weight:800}
.blabels{display:flex;gap:3px} .blabels span{flex:1 1 0;min-width:0;max-width:28px;text-align:center;font-size:10px;font-weight:700;color:var(--usuzumi)}
.band{height:28px;display:flex;border:1.5px solid var(--sumi);border-radius:2px;overflow:hidden}
.band span{display:flex;align-items:center;justify-content:center;color:var(--kinari);font-family:var(--mincho);font-weight:800;font-size:12px;min-width:0}
.band span+span{border-left:1.5px solid var(--sumi)}
.tbl{border-collapse:collapse;font-size:12px;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--sumi);color:var(--kinari);font-weight:700;padding:6px 8px;text-align:left}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--suna)}
.tbl td.r,.tbl th.r{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:390px;width:calc(100% - 40px);background:var(--sumi);color:var(--kinari);padding:12px 16px;border-radius:6px;font-size:13px;font-weight:500;line-height:1.6;z-index:20}
.notice{display:flex;align-items:center;gap:10px;padding:10px 12px;border:var(--stroke) solid var(--sumi);border-radius:4px;background:var(--kinari);font-size:13px;line-height:1.6;text-decoration:none}
.pre{white-space:pre-line}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<body>
<div id="app" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   勤怠帖 — 個人用の勤怠アプリ
   記録と設定はこの端末のブラウザ（localStorage）にだけ保存します。
   ========================================================= */

/* ---------- 保存 ---------- */
const STORE_KEY = 'ukiyo-kintai:v1';
const DEFAULT_SETTINGS = {
  lastName: '', fullName: '', dept: '', siteTeam: '',
  ownTo: '', siteTo: '', selfTo: '',
  webhook: '', threadLink: '', threadMonth: '',
  start: '10:00', end: '19:00', brk: '1:00',
  task: '', otLimit: 20,
  startDate: ''
};
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return { v: 1, settings: Object.assign({}, DEFAULT_SETTINGS, d.settings || {}), recs: d.recs || {} };
    }
  } catch (e) {}
  return { v: 1, settings: Object.assign({}, DEFAULT_SETTINGS), recs: {} };
}
let DB = load();
if (!DB.settings.startDate) { DB.settings.startDate = todayKey(); save(); }
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { toast('保存できませんでした。ブラウザの保存領域を確認してください。'); }
}

/* ---------- 日付と時刻 ---------- */
const WD = ['日', '月', '火', '水', '木', '金', '土'];
function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() { return keyOf(new Date()); }
function parseKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function md(k) { const d = parseKey(k); return (d.getMonth() + 1) + '/' + d.getDate(); }
function mdw(k) { const d = parseKey(k); return md(k) + '（' + WD[d.getDay()] + '）'; }
function jpDate(k) { const d = parseKey(k); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）'; }
function toM(t) { if (!t) return null; const p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function dur(m) { return m == null ? '' : Math.floor(m / 60) + ':' + pad(m % 60); }
function durJp(m) { return Math.floor(m / 60) + '時間' + pad(m % 60) + '分'; }
function jpTime(t) { const m = toM(t); const h = Math.floor(m / 60), mi = m % 60; return h + '時' + (mi ? pad(mi) + '分' : ''); }
function nowM() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function ceil15(m) { return Math.ceil(m / 15) * 15; }
function times(from, to) { const r = []; for (let m = from; m <= to; m += 15) r.push(hm(m)); return r; }
function monthKey(k) { return k.slice(0, 7); }
function daysIn(mk) { const p = mk.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); }

/* 日本の祝日（振替休日・国民の休日を含む） */
const HOL_CACHE = {};
function holidays(y) {
  if (HOL_CACHE[y]) return HOL_CACHE[y];
  const h = {};
  const set = (m, d, name) => { h[y + '-' + pad(m) + '-' + pad(d)] = name; };
  const nthMon = (m, n) => { const first = new Date(y, m - 1, 1).getDay(); return 1 + ((8 - first) % 7) + (n - 1) * 7; };
  set(1, 1, '元日'); set(1, nthMon(1, 2), '成人の日'); set(2, 11, '建国記念の日'); set(2, 23, '天皇誕生日');
  set(3, Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), '春分の日');
  set(4, 29, '昭和の日'); set(5, 3, '憲法記念日'); set(5, 4, 'みどりの日'); set(5, 5, 'こどもの日');
  set(7, nthMon(7, 3), '海の日'); set(8, 11, '山の日'); set(9, nthMon(9, 3), '敬老の日');
  set(9, Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), '秋分の日');
  set(10, nthMon(10, 2), 'スポーツの日'); set(11, 3, '文化の日'); set(11, 23, '勤労感謝の日');
  // 国民の休日（祝日に挟まれた平日）
  Object.keys(h).forEach((k) => {
    const d = parseKey(k); const n2 = new Date(d); n2.setDate(d.getDate() + 2);
    const mid = new Date(d); mid.setDate(d.getDate() + 1);
    if (h[keyOf(n2)] && !h[keyOf(mid)] && mid.getDay() !== 0) h[keyOf(mid)] = '国民の休日';
  });
  // 振替休日
  Object.keys(h).sort().forEach((k) => {
    const d = parseKey(k);
    if (d.getDay() === 0) { const n = new Date(d); do { n.setDate(n.getDate() + 1); } while (h[keyOf(n)]); h[keyOf(n)] = '振替休日'; }
  });
  HOL_CACHE[y] = h; return h;
}
function holidayName(k) { return holidays(Number(k.slice(0, 4)))[k] || ''; }
function isWorkday(k) { const w = parseKey(k).getDay(); return w !== 0 && w !== 6 && !holidayName(k); }

/* ---------- 勤怠の記録 ---------- */
const KIND = {
  normal: { label: '通常勤務', short: '通常' }, late: { label: '遅刻', short: '遅刻' }, early: { label: '早退', short: '早退' },
  absent: { label: '欠勤', short: '欠勤' }, leave: { label: '有休', short: '有休' }, holidaywork: { label: '休日出勤', short: '休日出勤' }
};
const STAMP = { in: ['出', '出勤', 'k-in'], out: ['退', '退勤', 'k-out'], late: ['遅', '遅刻', 'k-late'], early: ['早', '早退', 'k-early'], absent: ['欠', '欠勤', 'k-absent'], leave: ['休', '有休', 'k-leave'] };
const S = () => DB.settings;
const isOff = (r) => r && (r.kind === 'absent' || r.kind === 'leave');
function stdWork() { return toM(S().end) - toM(S().start) - (toM(S().brk) || 0); }
function rec(k) { return DB.recs[k]; }
function putRec(k, r) { DB.recs[k] = Object.assign({}, r); save(); }
/* 押し忘れても既定で入る：使い始めた日以降の過去の平日は、記録がなければ既定の勤務として扱う */
function eff(k) {
  const t = todayKey();
  const r = DB.recs[k];
  if (r) {
    if (r.kind === 'none') return null;
    if (!isOff(r) && r.start && !r.end && k < t) return Object.assign({}, r, { end: S().end, autoEnd: true });
    return r;
  }
  if (k < t && k >= S().startDate && isWorkday(k)) return { kind: 'normal', start: S().start, end: S().end, brk: S().brk, task: S().task, note: '', auto: true };
  return null;
}
function workOf(r) { if (!r || isOff(r) || !r.start || !r.end) return null; return Math.max(0, toM(r.end) - toM(r.start) - (toM(r.brk) || 0)); }
function otOf(r) { const w = workOf(r); return w == null ? null : Math.max(0, w - stdWork()); }
function stampOf(r) { if (!r) return null; if (r.kind === 'normal' || r.kind === 'holidaywork') return r.end ? 'out' : 'in'; return r.kind; }
function noteOf(r) { return [r.note, r.endNote, r.part && r.part !== '終日' ? r.part : ''].filter(Boolean).join(' / '); }
function stampHtml(st, size) { if (!st) return ''; const s = STAMP[st]; return '<span class="stamp ' + s[2] + '" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * .55) + 'px" aria-hidden="true">' + s[0] + '</span>'; }

/* 月の集計（確定分：今日より前の日） */
function monthStats(mk) {
  const t = todayKey(); const n = daysIn(mk);
  let days = 0, work = 0, ot = 0; const bars = []; const kinds = { in: 0, late: 0, early: 0, absent: 0, leave: 0 };
  let remainWorkdays = 0;
  for (let d = 1; d <= n; d++) {
    const k = mk + '-' + pad(d);
    if (k >= t) { if (isWorkday(k)) remainWorkdays++; continue; }
    const r = eff(k); if (!r) continue;
    const w = workOf(r);
    if (w != null && w > 0) { days++; work += w; ot += otOf(r); bars.push({ d, w }); }
    if (r.kind === 'normal' || r.kind === 'holidaywork') kinds.in++; else if (kinds[r.kind] != null) kinds[r.kind]++;
  }
  const forecast = days ? Math.round(ot + (ot / days) * remainWorkdays) : 0;
  return { days, work, ot, bars, kinds, forecast, remainWorkdays };
}

/* ---------- 文面 ---------- */
function teamsDaily(k, r) {
  const lines = [];
  if (r.start && r.start !== S().start) { lines.push(md(k) + ' ' + r.start + ' 業務開始'); lines.push(r.note || '［理由］'); }
  lines.push(md(k) + ' ' + (r.end || S().end) + ' 業務終了');
  if (r.end && toM(r.end) < toM(S().end)) lines.push(r.endNote || '［理由］');
  return lines.join('\n');
}
function teamsOff(k, r) { return md(k) + ' ' + (r.kind === 'absent' ? '欠勤' : '有休') + (r.part && r.part !== '終日' ? '（' + r.part + '）' : '') + '\n' + (r.note || '［理由］'); }
function mailsFor(k, r) {
  const s = S();
  const last = s.lastName || '［姓］', full = s.fullName || '［氏名］', dept = s.dept || '［部署］', team = s.siteTeam || '［現場での所属］';
  const reason = (r.kind === 'early' ? r.endNote : r.note) || '［理由］';
  const word = { late: '遅刻', early: '早退', absent: '欠勤', leave: '休暇取得' }[r.kind] || '';
  const line = { late: '下記日程で遅刻致します。', early: '下記日程で早退致します。', absent: '下記日程で欠勤致します。', leave: '下記日程で有給休暇を取得致します。' }[r.kind];
  let extra = '';
  if (r.kind === 'late') extra = r.start + '出社予定　';
  if (r.kind === 'early') extra = r.end + '退社予定　';
  if (r.kind === 'leave' && r.part && r.part !== '終日') extra = r.part + '　';
  const own = {
    to: s.ownTo, subject: '【勤怠連絡】' + last + '　' + md(k) + word,
    body: ['各位', '', 'お疲れ様です。', dept + '　' + last + 'です。', '']
      .concat(k === todayKey() ? ['当日連絡で申し訳ありません。'] : [])
      .concat([line, mdw(k) + '　' + extra + '理由：' + reason, '', '※現場調整済みです。', '', 'どうぞよろしくお願い致します。']).join('\n')
  };
  let siteLine = '';

function mailto(to, subject, body) {

/* ---------- Teams（ワークフローの webhook）へ送る ---------- */
/* 返信先スレッドのリンク（Teamsで投稿の「…」→「リンクをコピー」）から、投稿のIDなどを取り出す */
function parseThread(link) {
  try {
    const u = new URL(String(link).trim());
    const m = u.pathname.match(/\/l\/message\/([^/]+)\/(\d+)/);
    if (!m) return null;
    const p = u.searchParams;
    const parent = p.get('parentMessageId');
    return {
      channelId: decodeURIComponent(m[1]),
      messageId: parent && parent !== '0' ? parent : m[2],
      teamId: p.get('groupId') || '',
      tenantId: p.get('tenantId') || ''
    };
  } catch (e) { return null; }
}
function threadOk() { return !!parseThread(S().threadLink); }
async function postTeams(text) {
  const url = S().webhook.trim();
  if (!url) return { ok: false, msg: 'TeamsのワークフローURLが設定されていません。' };
  const th = parseThread(S().threadLink);
  if (!th) return { ok: false, msg: '返信先スレッドのリンクが設定されていません。設定から貼り付けてください。' };
  const card = {
    type: 'message',
    // ワークフロー（「チャネル内のメッセージで返信する」）が使う値
    text: text,
    html: text.split('\n').map(esc).join('<br>'),
    messageId: th.messageId, channelId: th.channelId, teamId: th.teamId,
    attachments: [{ contentType: 'application/vnd.microsoft.card.adaptive', contentUrl: null,
      content: { $schema: 'http://adaptivecards.io/schemas/adaptive-card.json', type: 'AdaptiveCard', version: '1.4',
        body: text.split('\n').map((t, i) => ({ type: 'TextBlock', text: t || ' ', wrap: true, spacing: i ? 'None' : 'Default' })) } }]
  };
  const body = JSON.stringify(card);
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    if (res.ok) return { ok: true, msg: 'Teamsに投稿しました。' };
    return { ok: false, msg: 'Teamsに送れませんでした（' + res.status + '）。URLを確かめてください。' };
  } catch (e) {
    // ブラウザの制限で中身の確認ができない送り方に切り替える
    try {
      await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body });
      return { ok: true, unsure: true, msg: '送信しました。Teamsのチャネルに届いたか確かめてください。' };
    } catch (e2) {
      return { ok: false, msg: 'Teamsに送れませんでした。通信状態とURLを確かめてください。' };
    }
  }
}

    '<p class="small" style="margin:0">登録すると記録に入ります。次の画面で、自社と現場先へのメールを確かめてから送れます。</p>' +
    (ill ? '<img class="ill" src="img/' + ill[0] + '.webp" alt="" style="width:' + ill[1] + 'px;height:' + ill[2] + 'px;margin-top:-8px">' :
      '<img class="ill" src="img/skeleton.webp" alt="" style="width:220px;height:120px;object-fit:cover;object-position:20% 40%;border-radius:4px;background:var(--yoru)">') +
    '<div style="margin-top:auto"><button class="btn primary" data-act="regSave">この内容で登録する</button></div>' + tabbar('register');
};

/* 4. 連絡のメール */
V.message = (q) => {
  const k = q.d || todayKey(); const r = rec(k);
  if (!r || !['late', 'early', 'absent', 'leave'].includes(r.kind)) { location.hash = '#register'; return ''; }
  const m = ui.msg;
  if (m.key !== k) { ui.msg = { key: k, tab: 'own', editing: false, edits: {}, status: Object.assign({}, r.sent || {}) }; }
  const M = ui.msg;
  const items = mailsFor(k, r);

  const names = { own: '自社宛て', site: '現場先宛て', teams: 'Teams' };

  if (!items[M.tab]) M.tab = 'own';
  const base = items[M.tab]; const ed = M.edits[M.tab] || {};

  const summary = KIND[r.kind].label + '・' + mdw(k) + (r.kind === 'late' ? ' ' + r.start : r.kind === 'early' ? ' ' + r.end : '') + '・' + ((r.kind === 'early' ? r.endNote : r.note) || '');

  return tanzaku('連絡文') +
    '<div class="head"><h1>連絡のメール</h1><span class="small">自社と現場先へ、1通ずつ送れます。</span></div>' +
    '<div class="row" style="gap:8px;margin-top:-8px">' + stampHtml(stampOf(r), 24) + '<span class="grow small" style="color:var(--sumi)">' + esc(summary) + '</span><a href="#register" style="font-size:13px;font-weight:700;min-height:44px;display:flex;align-items:center">直す</a></div>' +
    '<div role="tablist" aria-label="宛先" style="display:grid;grid-template-columns:repeat(' + order.length + ',minmax(0,1fr));gap:8px">' +
    order.map((id) => '<button type="button" role="tab" class="chip" style="padding:0 6px" data-act="msgTab" data-v="' + id + '" aria-selected="' + (M.tab === id) + '">' + names[id] + (M.status[id] ? '・済' : '') + '</button>').join('') + '</div>' +
    '<section class="card" aria-label="メール" style="padding:0;display:flex;flex-direction:column;min-height:300px">' +
    '<dl style="padding:2px 14px;border-bottom:1px solid var(--suna)"><div class="row" style="gap:8px;min-height:44px"><dt class="label" style="width:36px">宛先</dt><dd class="grow" style="font-size:13px;word-break:break-all">' + toLine + '</dd>' +
    (edited && !done ? '<button class="textbtn" style="font-size:12px;color:var(--usuzumi)" data-act="msgReset">元に戻す</button>' : '') +
    (!done ? '<button class="chip" style="height:32px;padding:0 10px;font-size:12px;display:flex;align-items:center;gap:4px" data-act="msgEdit" aria-pressed="' + editing + '">' + icon('pen', 16) + (editing ? '直し終える' : (edited ? '直した文面' : '文面を直す')) + '</button>' : '') + '</div>' +
    (M.tab !== 'teams' ? '<div class="row divider" style="gap:8px;min-height:36px"><dt class="label" style="width:36px"><label for="mSubject">件名</label></dt><dd class="grow">' +
      (editing ? '<input id="mSubject" class="input" style="height:36px;font-size:13px;font-weight:700;margin:4px 0" value="' + esc(cur.subject) + '" data-live="mSubject">' : '<span style="font-size:13px;font-weight:700">' + esc(cur.subject) + '</span>') + '</dd></div>' : '') +
    '</dl>' +
    (editing ? '<div style="flex-grow:1;display:flex;padding:10px 12px"><label class="sr" for="mBody">本文</label><textarea id="mBody" class="input" style="flex-grow:1;min-height:260px" data-live="mBody">' + esc(cur.body) + '</textarea></div>'
      : '<div style="padding:12px 14px"><p class="body pre" style="margin:0">' + esc(cur.body) + '</p></div>') +
    '</section>' +
    '<div class="row" style="align-items:flex-end;gap:8px"><div class="field grow" style="gap:4px"><span class="label row" style="gap:6px">' + icon('mail', 18) + '送った連絡</span>' +
    order.map((id) => '<div class="row between" style="font-size:13px;line-height:1.7"><span>' + names[id] + '</span><span style="' + (M.status[id] ? 'font-weight:700' : 'color:var(--usuzumi)') + '">' + esc(M.status[id] || '未送信') + '</span></div>').join('') +
    '<a href="#done?d=' + k + '" style="font-size:13px;font-weight:700;min-height:40px;display:flex;align-items:center">登録を終える</a></div>' +

    '<div class="row" style="gap:8px;margin-top:auto"><button class="btn" style="width:96px;flex-shrink:0" data-act="msgCopy">' + icon('copy', 18) + '写す</button>' +
    '<button class="btn primary"' + (done ? ' disabled' : '') + ' data-act="msgSend">' + esc(done ? M.status[M.tab] : sendNames[M.tab]) + '</button></div>' +
    (M.tab !== 'teams' && !done ? '<p class="small" style="margin:-8px 0 0">押すとメールアプリが開きます。送信はメールアプリで行います。</p>' : '') +
    tabbar('register');
};

/* 5. 登録完了 */
V.done = (q) => {
  const k = q.d || todayKey(); const r = rec(k);
  if (!r) { location.hash = '#home'; return ''; }
  const sent = r.sent || {};
  const rows = [['種類', stampHtml(stampOf(r), 24) + ' ' + esc(KIND[r.kind].label)], ['日付', esc(jpDate(k))]];
  if (r.kind === 'late') rows.push(['時刻', esc(r.start) + ' 出勤予定']);

  rows.push(['連絡', esc(['own', 'site', 'teams'].filter((x) => sent[x]).map((x) => ({ own: '自社', site: '現場先', teams: 'Teams' })[x] + ' ' + sent[x].replace(/^[^0-9]*/, '')).join('・') || 'なし')]);
  return tanzaku('登録完了') +
    '<div class="head"><h1>登録しました</h1><span class="small">勤怠の記録に入れました。</span></div>' +
    '<section class="card" style="padding:8px 16px 20px"><dl>' + rows.map((x, i) =>
      '<div class="row' + (i ? ' divider' : '') + '" style="min-height:44px"><dt class="label" style="width:56px">' + x[0] + '</dt><dd class="row" style="gap:8px;font-size:15px;font-weight:' + (i === 0 ? 700 : 500) + '">' + x[1] + '</dd></div>').join('') +
    '</dl><div class="rakkan" role="img" aria-label="完了の印">完了</div></section>' +
    '<img class="ill" src="img/frogs_dance.webp" alt="" style="width:100%;height:220px;margin-top:12px;object-position:center">' +
    '<div class="row" style="gap:12px;margin-top:auto"><a class="btn" href="#home">ホームへ</a><a class="btn" href="#calendar?m=' + monthKey(k) + '">暦で見る</a></div>' + tabbar('register');
};

/* 6. 暦 */
V.calendar = (q) => {
  const t = todayKey();
  const mk = q.m || ui.cal.month || monthKey(t); ui.cal.month = mk;
  const n = daysIn(mk); const first = parseKey(mk + '-01').getDay();
  if (!ui.cal.sel || monthKey(ui.cal.sel) !== mk) ui.cal.sel = monthKey(t) === mk ? t : mk + '-01';
  const sel = ui.cal.sel;
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<span class="empty" aria-hidden="true"></span>');
  for (let d = 1; d <= n; d++) {
    const k = mk + '-' + pad(d); const w = parseKey(k).getDay(); const r = eff(k); const hol = holidayName(k);
    const cls = [k === t ? 'today' : '', w === 6 ? 'sat' : '', w === 0 ? 'sun' : '', hol ? 'hol' : ''].join(' ');
    cells.push('<button type="button" class="' + cls + '" data-act="calSel" data-v="' + k + '" aria-pressed="' + (k === sel) + '" aria-label="' + (d + '日' + (r ? ' ' + STAMP[stampOf(r)][1] : '') + (hol ? ' ' + hol : '') + (k === t ? ' 今日' : '')) + '"><span class="d">' + d + '</span>' +
      (r ? stampHtml(stampOf(r), 18) : (hol ? '<span style="height:18px;font-size:10px;font-weight:700;color:var(--usuzumi)">祝</span>' : '<span style="height:18px"></span>')) + '</button>');
  }
  while (cells.length % 7) cells.push('<span class="empty" aria-hidden="true"></span>');
  const p = mk.split('-').map(Number);
  const prev = keyOf(new Date(p[0], p[1] - 2, 1)).slice(0, 7), next = keyOf(new Date(p[0], p[1], 1)).slice(0, 7);
  const r = eff(sel); const hol = holidayName(sel);
  let panel;
  if (ui.cal.editing) {
    const g = ui.cal.draft; const off = g.kind === 'absent' || g.kind === 'leave' || g.kind === 'none';
    const gw = off ? null : workOf(g);
    panel = '<div class="field" style="gap:10px"><div class="field"><label for="cKind">勤怠区分</label><select id="cKind" class="input" style="font-family:var(--gothic);font-size:15px" data-field="cKind">' +
      options([['normal', '通常勤務'], ['late', '遅刻'], ['early', '早退'], ['absent', '欠勤'], ['leave', '有休'], ['holidaywork', '休日出勤'], ['none', '記録なし']], g.kind) + '</select></div>' +
      '<div class="grid3">' + [['cStart', '開始', 'start', times(6 * 60, 24 * 60)], ['cEnd', '終了', 'end', times(6 * 60, 24 * 60)], ['cBrk', '休憩', 'brk', ['0:00', '0:15', '0:30', '0:45', '1:00', '1:15', '1:30', '1:45', '2:00']]].map((f) =>
        '<div class="field"><label for="' + f[0] + '">' + f[1] + '</label><select id="' + f[0] + '" class="input" style="padding:0 4px;font-size:16px" data-field="' + f[0] + '"' + (off ? ' disabled' : '') + '>' + options([['', '—']].concat(f[3]), g[f[2]] || '') + '</select></div>').join('') + '</div>' +
      '<p class="small" style="margin:0">時間 <b class="num" style="color:var(--sumi)">' + (gw == null ? '—' : dur(gw)) + '</b>・残業 <b class="num" style="color:var(--sumi)">' + (gw == null ? '—' : dur(Math.max(0, gw - stdWork()))) + '</b></p>' +
      '<div class="field"><label for="cTask">作業内容（作業場所）</label><input id="cTask" class="input" value="' + esc(g.task || '') + '" data-live="cTask"' + (off ? ' disabled' : '') + '></div>' +
      '<div class="field"><label for="cNote">備考</label><input id="cNote" class="input" value="' + esc(g.note || '') + '" data-live="cNote"></div>' +
      '<div class="row" style="gap:12px"><button class="textbtn" data-act="calCancel">やめる</button><button class="btn primary" data-act="calSave">この内容で直す</button></div></div>';
  } else {
    const wv = r ? workOf(r) : null;
    const stats = [['開始', r && r.start], ['終了', r && r.end], ['休憩', r && !isOff(r) ? r.brk : ''], ['時間', wv == null ? '' : dur(wv)]];
    panel = '<dl class="grid4 divider" style="padding:10px 0">' + stats.map((s) => '<div><dt class="label">' + s[0] + '</dt><dd class="num" style="font-size:17px;font-weight:700">' + esc(s[1] || '—') + '</dd></div>').join('') + '</dl>' +
      '<dl><div class="row divider" style="min-height:38px"><dt class="label" style="width:72px">作業内容</dt><dd style="font-size:15px">' + esc((r && r.task) || '—') + '</dd></div>' +
      '<div class="row divider" style="min-height:38px"><dt class="label" style="width:72px">備考</dt><dd style="font-size:15px">' + esc((r && noteOf(r)) || hol || '—') + '</dd></div></dl>' +
      (sel <= t ? '<button class="btn" style="height:44px;margin-top:10px;font-size:15px" data-act="calEdit">' + icon('pen', 18) + 'この日を直す</button>' :
        '<p class="small" style="margin:8px 0 0">先の日の有休や欠勤は<a href="#register">「登録」</a>から入れます。</p>') +
      (r && r.auto ? '<p class="small" style="margin:8px 0 0">打刻がなかったため、既定の時刻で入っています。</p>' : '');
  }
  const st = r ? STAMP[stampOf(r)] : null;
  let state = r ? (r.kind === 'normal' ? (r.end ? '通常勤務' : '出勤中') : KIND[r.kind].label) : (hol ? '祝日' : (isWorkday(sel) ? (sel > t ? '予定なし' : '記録なし') : '休日'));
  const o = r ? otOf(r) : null; if (o) state += '・残業 ' + dur(o);
  return tanzaku('暦') +
    '<div class="row" style="gap:0;margin:-4px 0 0 -12px"><a href="#calendar?m=' + prev + '" aria-label="前の月" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">' + icon('left', 20) + '</a><h1>' + p[0] + '年' + p[1] + '月</h1><a href="#calendar?m=' + next + '" aria-label="次の月" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">' + icon('right', 20) + '</a></div>' +
    '<ul aria-label="印の見かた" style="margin:-8px 56px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px">' + Object.keys(STAMP).map((s) => '<li class="row" style="gap:4px;font-size:11px;font-weight:700">' + stampHtml(s, 16) + STAMP[s][1] + '</li>').join('') + '</ul>' +
    '<div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--usuzumi);padding-bottom:6px">' + WD.map((w, i) => '<span' + (i === 6 ? ' style="color:var(--ai)"' : '') + '>' + w + '</span>').join('') + '</div><div class="cal">' + cells.join('') + '</div></div>' +
    '<section class="card" aria-label="選んだ日の記録" style="padding:14px 16px 16px"><div class="row" style="gap:10px;padding-bottom:8px"><h2 class="grow">' + jpDate(sel) + (sel === t ? '・今日' : '') + '</h2>' + (st ? stampHtml(stampOf(r), 24) : '') + '<span style="font-size:13px;font-weight:700">' + esc(state) + '</span></div>' + panel + '</section>' + tabbar('calendar');
};

/* 7. まとめ */
V.summary = (q) => {
  const t = todayKey(); const mk = q.m || monthKey(t); const p = mk.split('-').map(Number);
  const st = monthStats(mk);
  const max = Math.max(1, ...st.bars.map((b) => b.w)); const peak = st.bars.reduce((a, b) => (b.w > (a ? a.w : -1) ? b : a), null);
  const parts = [['in', '出', '出勤', 'var(--ai)'], ['late', '遅', '遅刻', 'var(--yamabuki)'], ['early', '早', '早退', 'var(--usuzumi)'], ['absent', '欠', '欠勤', 'var(--shu)'], ['leave', '休', '有休', 'var(--kaeru)']].filter((x) => st.kinds[x[0]]);
  const prev = keyOf(new Date(p[0], p[1] - 2, 1)).slice(0, 7), next = keyOf(new Date(p[0], p[1], 1)).slice(0, 7);
  const lastDay = mk === monthKey(t) ? Math.max(0, parseKey(t).getDate() - 1) : daysIn(mk);
  const big = (m) => '<span class="num numeral">' + Math.floor(m / 60) + '</span><span class="num" style="font-size:16px;font-weight:700">時間</span><span class="num numeral">' + pad(m % 60) + '</span><span class="num" style="font-size:16px;font-weight:700">分</span>';
  const mid = (m) => '<span class="num" style="font-size:30px">' + Math.floor(m / 60) + '</span><span class="num" style="font-size:14px;font-weight:700">時間</span><span class="num" style="font-size:30px">' + pad(m % 60) + '</span><span class="num" style="font-size:14px;font-weight:700">分</span>';
  return tanzaku('まとめ') + '<a class="gear" href="#settings" aria-label="設定">' + icon('gear') + '</a>' +
    '<div class="head" style="padding-right:108px"><div class="row" style="gap:0;margin-left:-12px"><a href="#summary?m=' + prev + '" aria-label="前の月" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">' + icon('left', 20) + '</a><h1>' + p[1] + '月のまとめ</h1><a href="#summary?m=' + next + '" aria-label="次の月" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">' + icon('right', 20) + '</a></div>' +
    '<span class="small">' + p[1] + '月1日〜' + (lastDay || 1) + '日（確定した分）</span></div>' +
    '<div class="row" style="align-items:flex-start;gap:8px"><div class="grow field" style="gap:12px"><div class="field" style="gap:2px"><span class="label">合計勤務時間</span><p class="row" style="gap:2px;align-items:baseline;margin:0">' + big(st.work) + '</p></div>' +
    '<div class="grid2" style="gap:12px"><div class="field" style="gap:2px"><span class="label">出勤日数</span><p class="row" style="gap:2px;align-items:baseline;margin:0"><span class="num" style="font-size:30px">' + st.days + '</span><span class="num" style="font-size:14px;font-weight:700">日</span></p></div>' +
    '<div class="field" style="gap:2px"><span class="label">残業時間</span><p class="row" style="gap:2px;align-items:baseline;margin:0">' + mid(st.ot) + '</p><a href="#overtime?m=' + mk + '" style="font-size:13px;font-weight:700;min-height:32px;display:flex;align-items:center">残業の注意を見る</a></div></div></div>' +
    '<img class="ill" src="img/frog_stick.webp" alt="" style="width:110px;height:140px;flex-shrink:0"></div>' +
    '<section aria-label="日ごとの勤務時間"><div class="row between"><h2>日ごとの勤務時間</h2><span class="label">単位：時間</span></div>' +
    (st.bars.length ? '<div class="bars" style="margin-top:8px">' + st.bars.map((b) => '<div class="b' + (peak && b.d === peak.d ? ' peak' : '') + '"><span>' + (Math.round(b.w / 6) / 10) + '</span><i style="height:' + Math.round(b.w / max * 120) + 'px"></i></div>').join('') + '</div>' +
      '<div class="blabels" style="margin-top:4px">' + st.bars.map((b) => '<span>' + b.d + '</span>').join('') + '</div>' +
      '<p class="small" style="margin:6px 0 0">いちばん長かったのは ' + peak.d + '日の' + dur(peak.w) + '。</p>' : '<p class="small">まだ記録がありません。</p>') + '</section>' +
    '<section aria-label="状態の内訳"><h2 style="margin-bottom:8px">状態の内訳</h2>' +
    (parts.length ? '<div class="band">' + parts.map((x) => '<span style="flex:' + st.kinds[x[0]] + ' 1 0;background:' + x[3] + '">' + x[1] + '</span>').join('') + '</div>' +
      '<ul style="margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px">' + parts.map((x) => '<li style="font-size:13px">' + x[2] + ' <b class="num">' + st.kinds[x[0]] + '</b>日</li>').join('') + '</ul>' : '<p class="small">まだ記録がありません。</p>') + '</section>' +
    '<div style="margin-top:auto"><a class="btn" href="#export?m=' + mk + '">月末の書き出しをする</a></div>' + tabbar('summary');
};

/* 8. 残業注意（暗い面） */
V.overtime = (q) => {
  const mk = q.m || monthKey(todayKey()); const st = monthStats(mk);
  const lim = Number(S().otLimit) || 20; const pct = Math.min(100, Math.round(st.ot / (lim * 60) * 100));
  const over = st.forecast > lim * 60;
  return '<div class="screen yoru" style="padding-bottom:24px">' + tanzaku('残業注意') +
    '<div class="head"><h1>' + (pct >= 60 || over ? '残業が増えています' : '今月の残業') + '</h1><span class="small">' + md(todayKey()) + ' の時点</span></div>' +
    '<div class="field" style="gap:2px"><span class="label">今月の残業</span><p class="row" style="gap:2px;align-items:baseline;margin:0"><span class="num numeral">' + Math.floor(st.ot / 60) + '</span><span class="num" style="font-size:16px;font-weight:700">時間</span><span class="num numeral">' + pad(st.ot % 60) + '</span><span class="num" style="font-size:16px;font-weight:700">分</span></p></div>' +

    const p = document.getElementById('teamsText'); if (p) p.textContent = teamsDaily(todayKey(), r);
  }
  if (f === 'regReason') ui.reg.reason = el.value;
  if (f === 'mSubject' || f === 'mBody') { const tab = ui.msg.tab; ui.msg.edits[tab] = Object.assign({}, ui.msg.edits[tab] || {}, f === 'mSubject' ? { subject: el.value } : { body: el.value }); }
  if (f === 'cTask') ui.cal.draft.task = el.value;
  if (f === 'cNote') ui.cal.draft.note = el.value;
});

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
